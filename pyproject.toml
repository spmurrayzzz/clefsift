[project]
name = "clefsift"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
train = [
    "unsloth==2026.10.3",
    "unsloth-zoo==2026.10.3",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers==5.17.0",
    "peft==0.21.2",
    "huggingface-hub==1.33.0",
    "safetensors==0.8.0",
    "accelerate==1.15.0",
    "numpy==2.4.6",
    "pillow==12.3.0",
    "pyyaml==6.0.3",
    "tokenizers==0.23.2",
    "xformers==0.0.35; (sys_platform == 'linux' or sys_platform == 'win32') and (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
xformers = [{ index = "pytorch-cu130", marker = "(sys_platform == 'linux' or sys_platform == 'win32') and (platform_machine == 'x86_64' or platform_machine == 'AMD64')" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
