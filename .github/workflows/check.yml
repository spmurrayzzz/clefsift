name: syntax

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          for file in extension/background.js extension/content/*.js extension/options/*.js extension/popup/*.js; do
            node --check "$file"
          done
          python -m compileall -q finetune tools
          for file in finetune/prepare.py finetune/generate.py finetune/assemble.py finetune/run.py finetune/evaluate.py; do
            python "$file" --help > /dev/null
          done
